<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Autofill Helper 设置</title>
    <style>
      body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 16px; }
      fieldset { margin-bottom: 16px; }
      label { display: block; margin: 6px 0 4px; }
      input[type=text], input[type=password] { width: 420px; padding: 6px; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      th { background: #f5f5f5; text-align: left; }
      .row { display: flex; gap: 8px; align-items: center; }
      button { padding: 6px 10px; }
      .warn { color: #a33; }
    </style>
  </head>
  <body>
    <h2>Autofill Helper 设置</h2>

    <fieldset>
      <legend>全局设置</legend>
      <label><input type="checkbox" id="autoSubmit"> 自动提交表单（谨慎开启）</label>
      <div class="row">
        <label for="masterPass">主口令（可选，用于本地加密）</label>
      </div>
      <input type="password" id="masterPass" placeholder="仅保存在本次浏览器会话（关闭浏览器后失效）">
      <div><small class="warn">提示：主口令不写入磁盘，仅存 <code>chrome.storage.session</code>；忘记主口令将无法解密之前以加密方式保存的条目。</small></div>
      <div style="margin-top:8px;">
        <button id="setMaster">设置/更新主口令</button>
        <button id="clearMaster">清除主口令</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>添加/更新站点凭据</legend>
      <div class="row">
        <label for="domain">域名</label>
      </div>
      <input type="text" id="domain" placeholder="例如: intranet.example.com 或 example.com">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="account id / email">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="••••••••">
      <div class="row" style="margin-top:8px;">
        <label><input type="checkbox" id="encrypt"> 使用主口令加密保存</label>
        <button id="save">保存/更新</button>
      </div>
    </fieldset>

    <h3>已保存的站点</h3>
    <table id="list">
      <thead>
        <tr><th>域名</th><th>模式</th><th>用户名</th><th>操作</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="options.js"></script>
  </body>
</html>
